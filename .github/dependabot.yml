version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/code/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/code/forecast-engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/code/simulator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/code/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "maven"
    directory: "/code"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
