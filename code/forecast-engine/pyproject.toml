[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-forecast"
version = "0.1.0"
description = "Forecast training and inference package for UrbanFlow"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow==21.0.0",
  "matplotlib==3.10.9",
  "pymysql==1.1.0",
  "python-dotenv==1.2.3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
deep = [
  "torch>=2.2,<3",
]

[project.scripts]
urbanflow-forecast = "urbanflow_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
